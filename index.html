
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>Mo Manga</title>
  <style>

      color: white;

  <div class="card">

    <button onclick="alert('سنضيف قارئ المانغا قريبًا!')">

    </button>
  </div>
</body>
</html>
